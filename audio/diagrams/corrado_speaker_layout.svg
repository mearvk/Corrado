<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="640" viewBox="0 0 520 640" font-family="Segoe UI, Arial, sans-serif">
  <!-- Corrado speaker location (top-down), reference -->
  <style>
    .title { font-size: 18px; font-weight: 700; fill: #1a1a1a; }
    .sub   { font-size: 12px; fill: #555; }
    .body  { fill: #eef2f5; stroke: #334; stroke-width: 2; }
    .glass { fill: #cfe3f2; stroke: #6a8; stroke-width: 1; }
    .spk   { fill: #2a7; stroke: #175; stroke-width: 1.5; }
    .tw    { fill: #d33; stroke: #911; stroke-width: 1; }
    .amp   { fill: #fff2e0; stroke: #b60; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lbl   { font-size: 12px; fill: #1a1a1a; }
    .note  { font-size: 11px; fill: #666; }
  </style>

  <text x="20" y="30" class="title">Corrado — Factory Speaker Layout</text>
  <text x="20" y="50" class="sub">Top-down. Standard = dash + rear. Premium adds door speakers + tweeters (and amp).</text>

  <!-- car body outline -->
  <path class="body" d="M160 80
      C120 90, 110 140, 115 190
      L112 470
      C112 540, 140 580, 190 586
      L330 586
      C380 580, 408 540, 408 470
      L405 190
      C410 140, 400 90, 360 80
      C300 70, 220 70, 160 80 Z"/>

  <!-- windshield / glass -->
  <path class="glass" d="M150 120 C210 108, 310 108, 370 120 L352 170 C300 160, 220 160, 168 170 Z"/>
  <text x="260" y="150" text-anchor="middle" class="note">windshield</text>

  <text x="260" y="100" text-anchor="middle" class="note">FRONT</text>
  <text x="260" y="602" text-anchor="middle" class="note">REAR</text>

  <!-- dash speakers 3.5" (front corners) -->
  <circle cx="150" cy="192" r="16" class="spk"/>
  <circle cx="370" cy="192" r="16" class="spk"/>
  <text x="150" y="230" text-anchor="middle" class="lbl">Dash L</text>
  <text x="370" y="230" text-anchor="middle" class="lbl">Dash R</text>
  <text x="260" y="212" text-anchor="middle" class="note">3.5" (standard front)</text>

  <!-- tweeters (premium) near A-pillar/sail -->
  <circle cx="140" cy="238" r="7" class="tw"/>
  <circle cx="380" cy="238" r="7" class="tw"/>
  <text x="118" y="258" class="note" fill="#d33">tw</text>
  <text x="386" y="258" class="note" fill="#d33">tw</text>

  <!-- door speakers (premium) ~5.25" -->
  <circle cx="128" cy="300" r="18" class="spk"/>
  <circle cx="392" cy="300" r="18" class="spk"/>
  <text x="128" y="342" text-anchor="middle" class="lbl">Door L</text>
  <text x="392" y="342" text-anchor="middle" class="lbl">Door R</text>
  <text x="260" y="305" text-anchor="middle" class="note">~5.25" (premium / some mkts)</text>

  <!-- rear speakers 4x6 (rear side panels) -->
  <rect x="126" y="470" width="46" height="30" rx="6" class="spk"/>
  <rect x="348" y="470" width="46" height="30" rx="6" class="spk"/>
  <text x="149" y="524" text-anchor="middle" class="lbl">Rear L</text>
  <text x="371" y="524" text-anchor="middle" class="lbl">Rear R</text>
  <text x="260" y="490" text-anchor="middle" class="note">4×6" (standard rear)</text>

  <!-- premium amp in trunk -->
  <rect x="210" y="540" width="100" height="34" rx="5" class="amp"/>
  <text x="260" y="562" text-anchor="middle" class="note" fill="#b60">AMP (premium)</text>

  <!-- legend -->
  <circle cx="34" cy="610" r="8" class="spk"/><text x="48" y="614" class="note">speaker</text>
  <circle cx="150" cy="610" r="6" class="tw"/><text x="162" y="614" class="note">tweeter (premium)</text>
  <rect x="300" y="602" width="18" height="14" rx="3" class="amp"/><text x="324" y="614" class="note">amp (premium)</text>
</svg>
